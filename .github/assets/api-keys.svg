<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Create an API key in the Finesse dashboard</title>
  <desc id="d">The Finesse dashboard at Settings, API Keys. Type a name for the key and press Create key. Keys are listed with their name, prefix (flv_ followed by eight characters), status, last used and created dates, and a Revoke button.</desc>
  <defs>
    <style>
      .sans { font-family: "Instrument Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .nav { font-size: 14px; fill: #14151A; }
      .navmuted { font-size: 12px; fill: #63656A; }
      .th { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; fill: #63656A; }
      .td { font-size: 14px; fill: #14151A; }
      .tdb { font-size: 14px; font-weight: 600; fill: #14151A; }
      .tdm { font-size: 13px; fill: #63656A; }
      .note { font-size: 14px; font-weight: 600; fill: #2547F0; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="559" rx="20" fill="#FCFBF8" stroke="#E4E1D9"/>

  <!-- sidebar -->
  <image x="30" y="28" width="98" height="36" href="data:image/png;base64,"/>
  <text x="32" y="108" class="sans navmuted">Developers</text>
  <text x="44" y="138" class="sans nav">API Playground</text>
  <rect x="24" y="152" width="188" height="32" rx="8" fill="#ECEAE3"/>
  <text x="44" y="173" class="sans nav" font-weight="600">API Keys</text>
  <text x="44" y="208" class="sans nav">Request Log</text>
  <text x="44" y="240" class="sans nav">Generations</text>
  <text x="44" y="272" class="sans nav">Analytics</text>
  <text x="32" y="320" class="sans navmuted">Account</text>
  <text x="44" y="350" class="sans nav">Settings</text>
  <text x="44" y="382" class="sans nav">Billing</text>
  <rect x="24" y="488" width="188" height="44" rx="10" fill="#FFFFFF" stroke="#E4E1D9"/>
  <rect x="34" y="498" width="24" height="24" rx="6" fill="#14151A"/>
  <text x="46" y="515" class="sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="68" y="508" class="sans" font-size="13" font-weight="600" fill="#14151A">Acme Studio</text>
  <text x="68" y="524" class="sans" font-size="11" fill="#63656A">Workspace</text>

  <!-- main panel -->
  <rect x="236" y="20" width="944" height="520" rx="16" fill="#F5F3EE" stroke="#E4E1D9"/>
  <text x="272" y="66" class="sans" font-size="24" font-weight="700" fill="#14151A">API Keys</text>
  <text x="272" y="92" class="sans" font-size="14" fill="#63656A">Create developer API keys to access the public Finesse API for Acme Studio.</text>

  <rect x="272" y="114" width="872" height="384" rx="14" fill="#FFFFFF" stroke="#E4E1D9"/>
  <text x="296" y="148" class="sans th">CREATE NEW KEY</text>
  <rect x="296" y="160" width="620" height="40" rx="8" fill="#FCFBF8" stroke="#2547F0" stroke-width="1.5"/>
  <text x="312" y="185" class="sans" font-size="14" fill="#14151A">My backend</text>
  <rect x="930" y="160" width="190" height="40" rx="8" fill="#14151A"/>
  <text x="1025" y="185" class="sans" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">+  Create key</text>

  <!-- table -->
  <line x1="296" y1="232" x2="1120" y2="232" stroke="#E4E1D9"/>
  <text x="296" y="254" class="sans th">NAME</text>
  <text x="500" y="254" class="sans th">PREFIX</text>
  <text x="650" y="254" class="sans th">STATUS</text>
  <text x="770" y="254" class="sans th">LAST USED</text>
  <text x="920" y="254" class="sans th">CREATED</text>
  <text x="1120" y="254" class="sans th" text-anchor="end">ACTIONS</text>
  <g>
    <line x1="296" y1="270" x2="1120" y2="270" stroke="#EEECE5"/>
    <text x="296" y="300" class="sans tdb">Production server</text>
    <text x="500" y="300" class="mono tdm">flv_4f2a91c0</text>
    <rect x="650" y="284" width="64" height="24" rx="12" fill="#1F9D63" fill-opacity=".12"/>
    <text x="682" y="301" class="sans" font-size="11" font-weight="700" fill="#1F9D63" text-anchor="middle">ACTIVE</text>
    <text x="770" y="300" class="sans tdm">12 Oct, 16:18</text>
    <text x="920" y="300" class="sans tdm">6 Oct, 12:15</text>
    <rect x="1050" y="284" width="70" height="26" rx="6" fill="#FFFFFF" stroke="#D23B2E" stroke-opacity=".4"/>
    <text x="1085" y="302" class="sans" font-size="12.5" font-weight="600" fill="#D23B2E" text-anchor="middle">Revoke</text>
  </g>
  <g>
    <line x1="296" y1="324" x2="1120" y2="324" stroke="#EEECE5"/>
    <text x="296" y="354" class="sans tdb">Staging</text>
    <text x="500" y="354" class="mono tdm">flv_b81d07e3</text>
    <rect x="650" y="338" width="64" height="24" rx="12" fill="#1F9D63" fill-opacity=".12"/>
    <text x="682" y="355" class="sans" font-size="11" font-weight="700" fill="#1F9D63" text-anchor="middle">ACTIVE</text>
    <text x="770" y="354" class="sans tdm">12 Oct, 14:36</text>
    <text x="920" y="354" class="sans tdm">6 Oct, 12:15</text>
    <rect x="1050" y="338" width="70" height="26" rx="6" fill="#FFFFFF" stroke="#D23B2E" stroke-opacity=".4"/>
    <text x="1085" y="356" class="sans" font-size="12.5" font-weight="600" fill="#D23B2E" text-anchor="middle">Revoke</text>
  </g>

  <!-- annotations -->
  <circle cx="296" cy="420" r="13" fill="#2547F0"/>
  <text x="296" y="425" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="318" y="425" class="sans note">Name the key and press Create key.</text>
  <circle cx="296" cy="460" r="13" fill="#2547F0"/>
  <text x="296" y="465" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="318" y="465" class="sans note">Copy the key: it's shown only once. It starts with flv_. Set it as FINESSE_API_KEY.</text>
  <text x="318" y="486" class="sans tdm">The list only shows each key's prefix. Revoke a key here if it leaks.</text>
</svg>
